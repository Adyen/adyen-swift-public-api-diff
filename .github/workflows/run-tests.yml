name: 🧪 Run Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      
jobs:

  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6.0'
    
    - name: Configure Xcode for Macros
      run: |
        defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
        defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
        
    - name: 🛠️ Run All Tests
      run: |
        xcodebuild test -scheme public-api-diff-Package -destination "platform=macOS" -skipPackagePluginValidation | xcpretty --utf --color && exit ${PIPESTATUS[0]}

    - name: 🧾 Validate JSON reference files against the schema
      run: |
        pip3 install --break-system-packages check-jsonschema
        check-jsonschema --schemafile docs/public-api-diff.schema.v1.json \
          Tests/IntegrationTests/Resources/expected-reference-changes-swift-interface-public.json \
          Tests/IntegrationTests/Resources/expected-reference-changes-swift-interface-private.json
